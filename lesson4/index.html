const STORAGE='new-general-masha-lesson-4-worth-the-hype-v1';
const empty=()=>({answers:{},visited:{},checked:{},tierItems:[],page:0,finished:false});
let state=empty();try{state={...state,...JSON.parse(localStorage.getItem(STORAGE)||'{}')}}catch(e){}
const save=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').toLowerCase().trim().replace(/[“”‘’]/g,"'").replace(/[^a-z0-9' -]/g,' ').replace(/\s+/g,' ');
const keys={};const pages=[];let page=state.page||0;
function add(title,kind,mins,html,group){pages.push({title,kind,mins,html,group})}
function section(title,html){return `<section class="section"><div class="section-kicker">${title}</div>${html}</section>`}
function prompt(txt){return `<p class="lead">${txt}</p>`}
function note(txt){return ''}
function open(id,label,placeholder='Write your answer...',rows=2){let v=state.answers[id]||'';return `<label class="free-label" for="${id}">${label}</label><textarea class="free-input ${rows===1?'free-small':''}" rows="${rows}" id="${id}" data-input="${id}" placeholder="${esc(placeholder)}">${esc(v)}</textarea>`}
function radio(id,q,opts,correct,explanation=''){keys[id]={type:'radio',correct,explanation};return `<div class="quiz" data-quiz="${id}"><p class="qprompt">${q}</p><div class="answers">${opts.map((o,i)=>`<label class="answer-option"><input type="radio" name="${id}" value="${i}" data-radio="${id}" ${String(state.answers[id])===String(i)?'checked':''}><span>${o}</span></label>`).join('')}</div><div class="feedback" data-feedback="${id}"></div></div>`}
function gap(id,before,after,ans){keys[id]={type:'gap',correct:ans};const value=state.answers[id]||'';return `<div class="gap-line" data-quiz="${id}">${before} <input type="text" aria-label="Complete the sentence" data-input="${id}" value="${esc(value)}" autocomplete="off" placeholder="..."> ${after}<div class="feedback" data-feedback="${id}"></div></div>`}
function choice(id,opts,correct){keys[id]={type:'choice',correct};let value=state.answers[id]??'';return `<select aria-label="Choose the correct form" data-choice="${id}" class="inline-choice" data-quiz="${id}"><option value="">Choose...</option>${opts.map((o,i)=>`<option value="${i}" ${String(value)===String(i)?'selected':''}>${esc(o)}</option>`).join('')}</select>`}
function checkbar(label='Check answers'){return `<div class="checkbar"><span class="feedback" data-page-result></span><button type="button" class="check-btn" data-checkpage>${label}</button></div>`}
function qsection(title,body){return section(title,body+checkbar())}
function ruleTitle(n,title){return `<div class="rule-head"><span class="rule-index">RULE ${n}</span><h3>${title}</h3></div>`}
const vocab=[['top-tier','первоклассный'],['overrated','переоценённый'],['underrated','недооценённый'],['iconic','культовый, легендарный'],['mid','посредственный (сленг)'],['live up to the hype','оправдать ажиотаж / ожидания'],['fall flat','не произвести ожидаемого впечатления'],['a letdown','разочарование'],['stand out','выделяться'],['have a soft spot for','питать слабость к'],['a guilty pleasure','любимое занятие, в котором немного неловко признаться'],['hit-or-miss','непредсказуемый по качеству'],['be worth it','стоить того'],['be on another level','быть на совершенно другом уровне']];

radio('hv3','3. <b>miss out on</b>',['spend too much on something','become obsessed with something','regret buying something','lose the chance to experience something'],3)+
radio('hv4','4. <b>get into something</b>',['see it repeatedly online','gradually become interested in it','decide it is overrated','try it only once'],1)+
radio('hv5','5. <b>worth it</b>',['popular enough to trend','good enough to justify the money, time or effort','better than everything else','cheap enough to buy immediately'],1))+
qsection('Choose the expression',prompt('Pick the phrase that completes the idea most naturally.')+
radio('hvc1','Everyone recommended the restaurant, but it really didn’t ______.',['miss out on','get into it','live up to the hype','give it a try'],2)+
radio('hvc2','I wasn’t interested in Tame Impala at first, but I slowly ______ their music.',['got into','missed out on','lived up to','gave a try'],0)+
radio('hvc3','€150 for that? I really don’t think it’s ______.',['underrated','missing out','got into','worth it'],3)),'Vocabulary');

add('Have You Actually Done It?','Visual speaking',3,
section('Experience board',prompt('Choose your answer for each experience. Then explain the most interesting one.')+`
<div class="visual-grid three">
 <div class="visual-card compact"><img src="https://images.unsplash.com/photo-1501386761578-eac5c94b800a?w=800&q=82" alt="Large concert"><div class="visual-caption"><b>Huge concert</b></div></div>

 <div class="visual-card compact"><img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=800&q=82" alt="Fashion event"><div class="visual-caption"><b>Fashion event</b></div></div>
 <div class="visual-card compact"><img src="https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=800&q=82" alt="Hair and beauty change"><div class="visual-caption"><b>Dramatic look change</b></div></div>
 <div class="visual-card compact"><img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=800&q=82" alt="Midnight film premiere"><div class="visual-caption"><b>Midnight premiere</b></div></div>
 <div class="visual-card compact"><img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?w=800&q=82" alt="Designer purchase"><div class="visual-caption"><b>Designer purchase</b></div></div>
</div>`+

radio('exp2','Solo trip',['Not for me','Done it','Would try'],null)+
radio('exp3','Fashion event',['Would try','Not for me','Done it'],null)+

prompt('Zendaya, Zac Efron, Hugh Jackman and Keala Settle play Never Have I Ever. Predict the group dynamic before watching.')+

add('Grammar Detective','Noticing',3,
qsection('Experience or finished event?',prompt('Choose what each sentence is doing.')+
radio('gd1','“Have you ever bought something because of TikTok?”',['Specific finished event','Life experience'],1)+
radio('gd2','“I bought a lip product last summer.”',['Life experience','Specific finished event'],1)+

add('Present Perfect','Grammar',5,
section('The core idea',`<div class="rule">${ruleTitle(1,'Has this happened before now?')}<p>Use <b>Present Perfect</b> for life experience when the exact finished time is not important or is not given.</p><div class="rule-example">“I <b>have tried</b> it.” · “She <b>has seen</b> that film.” · “We <b>haven’t been</b> there.”</div><p><b>Form:</b> have / has + <b>V3</b> (past participle)</p></div>
<div class="rule">${ruleTitle(2,'ever / never')}<p><b>ever</b> asks about any time before now. <b>never</b> means “not at any time before now.”</p><div class="rule-example">“Have you <b>ever bought</b> something because of TikTok?”<br>“I’ve <b>never understood</b> the hype around that brand.”</div></div>
<div class="rule">${ruleTitle(3,'Switch to Past Simple for the story')}<p>When the conversation moves to <b>when, where or what exactly happened</b>, use Past Simple.</p><div class="rule-example"><b>Have you ever been</b> to Italy?<br>— Yes, I have.<br><b>When did you go?</b><br>— I <b>went</b> in 2024.</div><p>Finished past time → Past Simple.</p><div class="rule-example wrongline">✕ I’ve bought it yesterday.<br>✓ I <b>bought</b> it yesterday.</div></div>`)+
section('Useful V3 forms',`<div class="table-wrap"><table class="table"><tr><th>Verb</th><th>Past Simple</th><th>V3</th></tr><tr><td>go</td><td>went</td><td><b>gone</b></td></tr><tr><td>see</td><td>saw</td><td><b>seen</b></td></tr><tr><td>buy</td><td>bought</td><td><b>bought</b></td></tr><tr><td>take</td><td>took</td><td><b>taken</b></td></tr><tr><td>do</td><td>did</td><td><b>done</b></td></tr><tr><td>be</td><td>was / were</td><td><b>been</b></td></tr></table></div>`)+
qsection('Quick check',radio('ppquick1','Which is correct?',['I’ve seen it last Friday.','I saw it last Friday.','I have saw it last Friday.','I was seen it last Friday.'],1)+radio('ppquick2','Which is correct?',['Have you ever went there?','Did you ever been there?','Have you ever been there?','Have you been there yesterday?'],2)),'Grammar');

add('Experience Check','Grammar in context',5,

add('The Viral Purchase','Reading',4,
section('Read',`<div class="article"><div class="article-header"><div class="eyebrow">SOCIAL MEDIA / CULTURE</div><h2>The Lip Oil I Couldn’t Escape</h2><p>One month, one algorithm, one unnecessary purchase.</p></div><div class="article-body"><p>For nearly a month, the same lip oil kept <b>popping up on Nina’s feed</b>. At first, she always <b>scrolled past</b> the videos. She already had <b>a lot of</b> makeup and didn’t need <b>any</b> more.</p><p>Then, while she <b>was scrolling through</b> TikTok one evening, she <b>came across</b> a review from a creator she actually trusted. The creator said she had used the product for months and that it genuinely <b>lived up to the hype</b>. Nina <b>saved the video for later</b>.</p><p>A few days later, almost everyone at work was suddenly talking about the same product. Nina usually tries not to buy things just because they are trending, but this time she didn’t want to <b>miss out</b>. She eventually <b>ended up ordering</b> it.</p><p>She has <b>used it a few times</b> now. The packaging looks great and the colour is nice, but the product itself isn’t very different from one she already owned. She also realised she had spent much more than she normally would on a lip product.</p><p>“I’ve definitely bought worse things,” she says, “but I still <b>don’t get the hype</b>. I probably wouldn’t buy it again.”</p></div></div>`)+
qsection('Read between the lines',radio('readh1','What changed Nina’s mind most?',['The packaging looked expensive.','TikTok offered her a discount.','A creator she trusted gave it a positive review.','Her colleagues bought it for her.'],2)+radio('readh2','Which best describes her final opinion?',['She regrets the purchase completely.','It is fine, but it does not deserve the attention it gets.','It exceeded her expectations.','She has not decided yet.'],1)+radio('readh3','Why is “was scrolling” used in paragraph 2?',['It describes a regular habit.','It shows a completed event after another completed event.','It describes something happening now.','It gives the background action when another event happened.'],3))+
section('Discuss',`<div class="discussion-box"><p>Did Nina buy it because she wanted it — or because she kept seeing it?</p><p>At what point does repeated advertising become annoying rather than effective?</p><p>For social media work, is it better for a product to appear everywhere for one week or consistently for several months?</p></div>`),'Reading');

section('Defend your choices',`<div class="question-stack"><p>How did you first <b>come across</b> it?</p><p>Have you tried / seen / bought it?</p><p>When did that happen?</p><p>Did it <b>live up to the hype</b>?</p><p>Would you recommend it to Kristina?</p><p>Was it <b>worth it</b>?</p></div>`+
`<div class="soft"><b>Use naturally</b><p>Present Perfect · Past Simple · one Past Continuous sentence · 3 expressions from today · 2 expressions from earlier lessons</p></div>`+
open('final-hype','Optional speaking notes','Worth the hype: ...\nOverrated: ...\nLate to the party: ...\nStill haven’t tried: ...',4)),'Final speaking');

// ───────────────────────────────── ENGINE ─────────────────────────────────
function idsInCurrentPage(){const box=document.getElementById('content');return [...new Set([...box.querySelectorAll('[data-quiz]')].map(e=>e.dataset.quiz))].filter(x=>keys[x]?.correct!==null&&keys[x]?.correct!==undefined)}
function evaluate(id){const q=keys[id];if(!q||q.correct===null||q.correct===undefined)return null;const a=state.answers[id];if(a===undefined||a==='')return null;return q.type==='gap' ? (Array.isArray(q.correct)?q.correct:[q.correct]).some(v=>norm(a)===norm(v)) : String(a)===String(q.correct)}
function paint(){
 const root=document.getElementById('content');
 for(const id of idsInCurrentPage()){
  const q=keys[id],correct=evaluate(id),marked=!!state.checked[id];
  const wrapper=root.querySelector(`[data-quiz="${id}"]`),feedback=root.querySelector(`[data-feedback="${id}"]`);
  if(!wrapper)continue;
  wrapper.querySelectorAll('.answer-option').forEach((option,i)=>{
   option.classList.toggle('is-right',marked&&i===q.correct&&correct!==null);
   option.classList.toggle('is-wrong',marked&&option.querySelector('input')?.checked&&i!==q.correct);
  });
  if(wrapper.matches('select,input')){
   wrapper.classList.toggle('is-right',marked&&correct===true);
   wrapper.classList.toggle('is-wrong',marked&&correct===false);
  }else{
   const field=wrapper.querySelector('input[type=text]');
   if(field){field.classList.toggle('is-right',marked&&correct===true);field.classList.toggle('is-wrong',marked&&correct===false)}
  }
  if(feedback){
   feedback.className='feedback';
   feedback.textContent='';
   if(marked&&correct!==null){feedback.classList.add(correct?'good':'bad');feedback.textContent=correct?'✓ Correct!':'Try again.'}
  }
 }
}
function checkPage(){const ids=idsInCurrentPage();let attempted=0,correct=0;for(const id of ids){const result=evaluate(id);if(result!==null){attempted++;state.checked[id]=true;if(result)correct++}}save();paint();const node=document.querySelector('[data-page-result]');if(node)node.textContent=`${correct} correct out of ${attempted} answered · ${ids.length} questions`}
function renderNav(){const nav=document.getElementById('nav');nav.innerHTML=pages.map((p,i)=>`<button type="button" data-page="${i}" class="nav-link ${i===page?'active':''} ${state.visited[i]?'done':''}"><span class="nav-no">${String(i+1).padStart(2,'0')}</span><span class="nav-title">${esc(p.title)}</span></button>`).join('');nav.querySelector('.active')?.scrollIntoView({block:'nearest'});}
function render(){page=Math.min(Math.max(page,0),pages.length-1);state.page=page;state.visited[page]=1;save();const p=pages[page];document.getElementById('pageIntro').innerHTML=`<h1 class="page-title">${esc(p.title)}</h1>`;document.getElementById('content').innerHTML=`<div class="surface">${p.html}</div>`;document.getElementById('counter').textContent=`${page+1} / ${pages.length}`;document.getElementById('prev').disabled=page===0;document.getElementById('next').textContent=page===pages.length-1?(state.finished?'Completed ✓':'Finish lesson ✓'):'Next →';renderNav();paint();if(document.getElementById('tierEditor'))renderTier();window.scrollTo({top:0,behavior:'instant'})}
function navigate(n){page=Math.max(0,Math.min(n,pages.length-1));render();document.getElementById('rail').classList.remove('open')}
const tierColors={S:'#dfadae',A:'#edd2a1',B:'#d6e1ae',C:'#b4cadd',F:'#d3bdd6'};
function renderTier(){const root=document.getElementById('tierEditor');if(!root)return;root.innerHTML=['S','A','B','C','F'].map(t=>`<div class="tier-row"><div class="tier-label" style="background:${tierColors[t]}">${t}<small>${{S:'ICONIC',A:'LOVE IT',B:'SOLID',C:'MID',F:'NOPE'}[t]}</small></div><div class="tier-content">${state.tierItems.map((x,i)=>x.tier===t?`<span class="rank-chip">${esc(x.name)} <select aria-label="Move ${esc(x.name)}" data-tier-move="${i}" style="border:0;background:transparent;color:#7a667b;font-size:12px"><option value="">Move</option>${['S','A','B','C','F'].filter(y=>y!==t).map(y=>`<option value="${y}">${y}</option>`).join('')}</select><button data-tier-delete="${i}" type="button" aria-label="Remove ${esc(x.name)}">×</button></span>`:'').join('')||'<span class="micro">Add something here...</span>'}</div></div>`).join('')}
document.addEventListener('input',e=>{if(e.target.dataset.input){state.answers[e.target.dataset.input]=e.target.value;state.checked[e.target.dataset.input]=false;save()} });
document.addEventListener('change',e=>{if(e.target.dataset.radio){state.answers[e.target.dataset.radio]=e.target.value;state.checked[e.target.dataset.radio]=false;save();paint()}if(e.target.dataset.choice){state.answers[e.target.dataset.choice]=e.target.value;state.checked[e.target.dataset.choice]=false;save();paint()}if(e.target.dataset.reflect){state.answers['reflect-'+e.target.dataset.reflect]=e.target.checked;save()}if(e.target.dataset.tierMove){const idx=+e.target.dataset.tierMove;if(e.target.value){state.tierItems[idx].tier=e.target.value;save();renderTier()}}});
document.addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p){navigate(+p.dataset.page);return}if(e.target.closest('[data-checkpage]')){checkPage();return}const del=e.target.closest('[data-tier-delete]');if(del){state.tierItems.splice(+del.dataset.tierDelete,1);save();renderTier();return}if(e.target.closest('#addTierItem')){const el=document.getElementById('rankNew'),name=el?.value.trim(),tier=document.getElementById('rankTier')?.value;if(name&&state.tierItems.length<30){state.tierItems.push({name,tier});el.value='';save();renderTier()}return}});
document.getElementById('prev').onclick=()=>navigate(page-1);document.getElementById('next').onclick=()=>{if(page===pages.length-1){state.finished=true;save();render();return}navigate(page+1)};document.getElementById('menu').onclick=()=>document.getElementById('rail').classList.toggle('open');document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('rail').classList.remove('open')}if(e.key==='Enter'&&e.target.id==='rankNew')document.getElementById('addTierItem')?.click()});
render();
</script>
</body></html>
